<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard de Estudo</title>
    <style>
        /* Aula 6 e 7: Estilos globais e fontes */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Aula 5 e 7: Configuração do container do flashcard */
        .flashcard-container {
            width: 300px;
            height: 200px;
            perspective: 1000px; /* Cria o efeito de profundidade 3D */
        }

        /* Aula 8: O cartão que vai girar */
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        /* Aula 8: Efeito de virar ao passar o mouse (:hover) */
        .flashcard-container:hover .flashcard {
            transform: rotateY(180deg);
        }

        /* Aula 6: Estilo comum para a frente e o verso */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Esconde o lado inverso enquanto gira */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Aula 6: Estilizando a Frente (Pergunta) */
        .frente {
            background-color: #3b82f6;
            color: white;
        }

        /* Aula 6 e 8: Estilizando o Verso (Resposta) */
        .verso {
            background-color: #10b981;
            color: white;
            transform: rotateY(180deg); /* Começa invertido para aparecer certo ao girar */
        }
    </style>
</head>
<body>

    <main class="flashcard-container">
        <article class="flashcard">
            
            <div class="face frente">
                <p>O que significa a sigla HTML?</p>
            </div>
            
            <div class="face verso">
                <p>HyperText Markup Language (Linguagem de Marcação de Hipertexto)</p>
            </div>

        </article>
    </main>

</body>
</html>
